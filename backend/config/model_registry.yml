# Kuro active model registry — keep in sync with config/active_models.py
# Verified against https://console.groq.com/docs/models (2026-09-21)

models:
  - id: openai/gpt-oss-120b
    label: primary-chat
    capabilities: [conversation, reasoning, code, summarization, general]
    fallback: ["openai/gpt-oss-20b"]
    max_context_tokens: 131072
    avg_latency_ms: 1200
    quality_tier: high
    cost_score: 4

  - id: openai/gpt-oss-20b
    label: fast-fallback
    capabilities: [conversation, fast, code, general]
    fallback: []
    max_context_tokens: 131072
    avg_latency_ms: 600
    quality_tier: medium
    cost_score: 2

routing_rules:
  - name: default
    choose: "openai/gpt-oss-120b"

  - name: short_query
    condition: "context_tokens < 2000 and message_len_chars < 300"
    choose: "openai/gpt-oss-20b"

  - name: casual_greeting
    intent: "casual_chat"
    choose: "openai/gpt-oss-120b"

  - name: code_generation
    intent: "code_generation"
    choose: "openai/gpt-oss-20b"

  - name: debugging
    intent: "debugging"
    choose: "openai/gpt-oss-20b"

  - name: reasoning_tasks
    intent: "math_solver"
    choose: "openai/gpt-oss-120b"

  - name: complex_reasoning
    intent: "complex_reasoning"
    choose: "openai/gpt-oss-120b"
